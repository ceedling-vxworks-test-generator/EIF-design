<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="860" viewBox="0 0 1560 860"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="22" fill="#0F172A" text-anchor="middle"><tspan x="780.0" y="47.7" font-weight="bold">EIFをヘキサゴナルアーキテクチャで描くと</tspan></text><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="15" fill="#1D4ED8" text-anchor="middle"><tspan x="270.0" y="94.4" font-weight="normal">◀ 使う側：EIFに要求してくる相手</tspan><tspan x="270.0" y="116.1" font-weight="normal">（接続相手が変わる → ここを足す）</tspan></text><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="15" fill="#C2410C" text-anchor="middle"><tspan x="1290.0" y="94.4" font-weight="normal">使われる側：EIFが呼びに行く相手 ▶</tspan><tspan x="1290.0" y="116.1" font-weight="normal">（機種が変わる → ここの対応表を足す）</tspan></text><polygon points="1031.1,565.0 780.0,710.0 528.9,565.0 528.9,275.0 780.0,130.0 1031.1,275.0" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="19" fill="#0F172A" text-anchor="middle"><tspan x="795.0" y="251.7" font-weight="bold">EIF コア</tspan></text><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="15" fill="#0F172A" text-anchor="middle"><tspan x="795.0" y="381.8" font-weight="normal">要求の受付</tspan><tspan x="795.0" y="403.5" font-weight="normal">応答先の振り分け</tspan><tspan x="795.0" y="425.2" font-weight="normal">情報の取得</tspan><tspan x="795.0" y="447.0" font-weight="normal">設定のマージ</tspan><tspan x="795.0" y="468.8" font-weight="normal">購読・差分の導出</tspan></text><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#166534" text-anchor="middle"><tspan x="795.0" y="594.8" font-weight