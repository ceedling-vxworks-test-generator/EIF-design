<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="22" fill="#0F172A" text-anchor="middle"><tspan x="650.0" y="47.7" font-weight="bold">ヘキサゴナルアーキテクチャ（Ports &amp; Adapters）の基本形</tspan></text><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="15" fill="#1D4ED8" text-anchor="middle"><tspan x="260.0" y="94.4" font-weight="normal">◀ 使う側（ドライビング側）</tspan><tspan x="260.0" y="116.1" font-weight="normal">コアに「お願い」をしてくる外の世界</tspan></text><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="15" fill="#C2410C" text-anchor="middle"><tspan x="1040.0" y="94.4" font-weight="normal">使われる側（ドリブン側） ▶</tspan><tspan x="1040.0" y="116.1" font-weight="normal">コアが「お願い」をしに行く外の世界</tspan></text><polygon points="866.5,505.0 650.0,630.0 433.5,505.0 433.5,255.0 650.0,130.0 866.5,255.0" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="18" fill="#0F172A" text-anchor="middle"><tspan x="650.0" y="256.3" font-weight="bold">コア（中心）</tspan></text><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="15" fill="#0F172A" text-anchor="middle"><tspan x="650.0" y="514.4" font-weight="normal">アプリの大事な処理だけを置く</tspan><tspan x="650.0" y="536.1" font-weight="normal">外の世界のことは何も知らない</tspan></text><rect x="363" y="310" width="140" height="46" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="433.5" y="337.9" font-weight="bold">入口ポート</tspan></text><rect x="796" y="310" width="140" height="46" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="866.5" y="337.9" font-weight="bold">出口ポート</tspan></text><rect x="363" y="410" width="140" height="46" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="433.5" y="437.9" font-weight="bold">入口ポート</tspan></text><rect x="796" y="410" width="140" height="46" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="866.5" y="437.9" font-weight="bold">出口ポート</tspan></text><rect x="180" y="290" width="170" height="80" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="265.0" y="324.8" font-weight="bold">Webアダプタ</tspan><tspan x="265.0" y="345.1" font-weight="normal">HTTP→コアの言葉</tspan></text><rect x="180" y="400" width="170" height="80" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="265.0" y="434.8" font-weight="bold">テスト用アダプタ</tspan><tspan x="265.0" y="455.1" font-weight="normal">試験からコアを呼ぶ</tspan></text><rect x="950" y="290" width="170" height="80" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="1035.0" y="324.8" font-weight="bold">DBアダプタ</tspan><tspan x="1035.0" y="345.1" font-weight="normal">コアの言葉→SQL</tspan></text><rect x="950" y="400" width="170" height="80" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="1035.0" y="434.8" font-weight="bold">偽物アダプタ</tspan><tspan x="1035.0" y="455.1" font-weight="normal">試験用のDB代わり</tspan></text><rect x="20" y="295" width="120" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="80.0" y="334.9" font-weight="bold">ブラウザ</tspan></text><rect x="20" y="405" width="120" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="80.0" y="444.9" font-weight="bold">テスト</tspan></text><rect x="1160" y="295" width="120" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#0F172A" text-anchor="middle"><tspan x="1220.0" y="334.9" font-weight="bold">データベース</tspan></text><line x1="140.0" y1="330.0" x2="178.0" y2="330.0" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><line x1="140.0" y1="440.0" x2="178.0" y2="440.0" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><line x1="350.0" y1="330.0" x2="361.5" y2="333.0" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><line x1="350.0" y1="440.0" x2="361.5" y2="433.0" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><line x1="938.5" y1="333.0" x2="948.0" y2="330.0" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><line x1="938.5" y1="433.0" x2="948.0" y2="440.0" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><line x1="1120.0" y1="330.0" x2="1158.0" y2="330.0" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="16" fill="#0F172A" text-anchor="middle"><tspan x="650.0" y="664.0" font-weight="normal">呼び出しの流れ：外 → アダプタ → ポート → コア → ポート → アダプタ → 外</tspan><tspan x="650.0" y="687.2" font-weight="normal">コアが決めるのはポート（差込口の形）だけ。アダプタは何個でも、差し替えも自由</tspan></text></svg>
