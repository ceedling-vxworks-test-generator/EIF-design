 5"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14" fill="#64748B" text-anchor="middle"><tspan x="1265.0" y="679.8" font-weight="bold">テスト用の偽物アダプタ</tspan><tspan x="1265.0" y="700.0" font-weight="normal">PCL・REFの代わり</tspan></text><rect x="230" y="760" width="1100" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="15" fill="#0F172A" text-anchor="middle"><tspan x="780.0" y="794.4" font-weight="normal">接続相手が増える → 左にアダプタを足す　｜　機種が変わる → 右のアダプタの対応表を足す</tspan><tspan x="780.0" y="816.1" font-weight="normal">設定の書込み先をPCL経由にする → 右のアダプタを差し替える　｜　どの場合もコアは変えない</tspan></text></svg>
